{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestras Citas 💙</title>
    <link rel="stylesheet" href="{% static 'citas/style.css' %}">
</head>
<body>
    <div class="contenedor-inicio">
        {% if mensaje %}
            <p class="mensaje-lindo">{{ mensaje.texto }}</p>
        {% else %}
            <p class="mensaje-lindo">Todavía no hay mensajes cargados 💭</p>
        {% endif %}

        <a href="{% url 'calendario' %}" class="boton-ir-calendario">Ver calendario</a>
    </div>
</body>
</html>
