{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar 💙</title>
    <link rel="stylesheet" href="{% static 'citas/style.css' %}">
</head>
<body>
    <div class="contenedor-inicio">
        <div class="modal-caja" style="max-width: 340px;">
            <h3>Ingresá para ver las citas</h3>

            <form method="POST">
                {% csrf_token %}

                <label>Usuario</label>
                <input type="text" name="username" required autofocus>

                <label>Contraseña</label>
                <input type="password" name="password" required>

                {% if form.errors %}
                    <p style="color: #ff5a5a; font-size: 0.85rem; margin-top: 10px;">
                        Usuario o contraseña incorrectos.
                    </p>
                {% endif %}

                <button type="submit" class="boton-agendar">Ingresar 💙</button>
            </form>

            <p style="text-align: center; margin-top: 14px;">
                <a href="#" onclick="document.getElementById('modal-fondo').classList.add('activo'); return false;" style="font-size: 0.85rem; color: var(--texto-suave);">
                    ¿No te acordás tu usuario o contraseña? 🤔
                </a>
            </p>
        </div>
    </div>

    <div id="modal-fondo" class="modal-fondo" onclick="if(event.target.id === 'modal-fondo') this.classList.remove('activo')">
        <div class="modal-caja" style="max-width: 340px;">
            <h3>Pista 🔑</h3>
            <p>
                <!-- REEMPLAZÁ ESTE TEXTO POR EL ACERTIJO REAL -->
                Acá va tu acertijo...
            </p>
            <button type="button" class="boton-agendar" onclick="document.getElementById('modal-fondo').classList.remove('activo')">
                Cerrar
            </button>
        </div>
    </div>
</body>
</html>
